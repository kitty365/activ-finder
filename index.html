<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Activ Finder">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <title>Activ Fitness Finder</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #e63946;
            --primary-dark: #c1121f;
            --bg: #1a1a2e;
            --bg-light: #16213e;
            --card: #0f3460;
            --text: #edf2f4;
            --text-muted: #8d99ae;
            --accent: #e63946;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg-light);
            padding: calc(var(--safe-top) + 8px) 16px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            border-bottom: 2px solid var(--accent);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .header h1 span {
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--card);
            border: none;
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s;
        }

        .btn-icon:active { background: var(--accent); }

        /* Map */
        #map {
            flex: 1;
            z-index: 1;
        }

        /* Bottom Sheet */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-light);
            border-radius: 20px 20px 0 0;
            z-index: 1001;
            transition: transform 0.3s ease;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
        }

        .bottom-sheet.collapsed {
            transform: translateY(calc(100% - 80px - var(--safe-bottom)));
        }

        .sheet-handle {
            width: 40px;
            height: 5px;
            background: var(--text-muted);
            border-radius: 3px;
            margin: 10px auto;
            cursor: pointer;
        }

        .sheet-header {
            padding: 0 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sheet-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .nearest-badge {
            background: var(--accent);
            color: white;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .studio-list {
            overflow-y: auto;
            padding: 0 12px calc(var(--safe-bottom) + 12px);
            -webkit-overflow-scrolling: touch;
        }

        .studio-card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            text-decoration: none;
            color: var(--text);
        }

        .studio-card:active {
            transform: scale(0.98);
        }

        .studio-card.nearest {
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.3);
        }

        .studio-distance {
            min-width: 58px;
            text-align: center;
        }

        .studio-distance .dist-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .studio-distance .dist-unit {
            font-size: 11px;
            color: var(--text-muted);
        }

        .studio-info {
            flex: 1;
            min-width: 0;
        }

        .studio-info .name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .studio-info .address {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .studio-nav {
            color: var(--text-muted);
            font-size: 20px;
            padding: 4px;
        }

        /* Search */
        .search-bar {
            padding: 0 16px 10px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-bar input:focus {
            border-color: var(--accent);
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--card);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Custom marker */
        .custom-marker {
            background: var(--accent);
            border: 3px solid white;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .custom-marker.nearest-marker {
            width: 20px;
            height: 20px;
            background: var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(230,57,70,0.5); }
            50% { box-shadow: 0 0 0 12px rgba(230,57,70,0); }
        }

        .user-marker {
            background: #4361ee;
            border: 3px solid white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            box-shadow: 0 0 0 4px rgba(67,97,238,0.3);
        }

        /* Popup */
        .leaflet-popup-content-wrapper {
            background: var(--bg-light);
            color: var(--text);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .leaflet-popup-tip { background: var(--bg-light); }

        .popup-content { padding: 4px; }
        .popup-content h3 { font-size: 14px; margin-bottom: 4px; }
        .popup-content p { font-size: 12px; color: var(--text-muted); margin: 2px 0; }
        .popup-content a {
            display: inline-block;
            margin-top: 6px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .popup-content .nav-link {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 14px;
            background: var(--accent);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Standort wird ermittelt...</div>
    </div>

    <div class="header">
        <h1><span>ACTIV</span> Fitness Finder</h1>
        <div class="header-actions">
            <button class="btn-icon" id="btn-locate" title="Mein Standort">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
            </button>
            <button class="btn-icon" id="btn-list" title="Liste anzeigen">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>
    </div>

    <div id="map"></div>

    <div class="bottom-sheet collapsed" id="bottomSheet">
        <div class="sheet-handle" id="sheetHandle"></div>
        <div class="sheet-header">
            <h2>Studios in der Nähe</h2>
            <span class="nearest-badge" id="studioCount">93 Studios</span>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Studio suchen...">
        </div>
        <div class="studio-list" id="studioList"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Studio data (Kategorie 1 + Kategorie 2 — included in Kat-2 subscription)
        let studios = [];
        fetch('studios.json').then(r => r.json()).then(data => { studios = data; startApp(); }).catch(() => {
            document.getElementById('loading').querySelector('.loading-text').textContent = 'Fehler beim Laden der Studiodaten.';
        });

        // State
        let map, userLat, userLng, userMarker, markers = [];
        let sheetExpanded = false;

        // Haversine distance in km
        function getDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function formatDist(km) {
            if (km < 1) return { value: Math.round(km * 1000), unit: 'm' };
            return { value: km.toFixed(1), unit: 'km' };
        }

        // Called once studios JSON is loaded
        function startApp() {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => { userLat = pos.coords.latitude; userLng = pos.coords.longitude; initMap(userLat, userLng); },
                    () => { userLat = 47.3769; userLng = 8.5417; initMap(userLat, userLng); },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
                );
            } else {
                userLat = 47.3769; userLng = 8.5417; initMap(userLat, userLng);
            }
        }

        function initMap(lat, lng) {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([lat, lng], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            const userIcon = L.divIcon({ className: 'user-marker', iconSize: [18, 18], iconAnchor: [9, 9] });
            userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
            userMarker.bindPopup('<div class="popup-content"><h3>Dein Standort</h3></div>');

            studios.forEach(s => { s.distance = getDistance(lat, lng, s.lat, s.lng); });
            studios.sort((a, b) => a.distance - b.distance);

            studios.forEach((s, i) => {
                const isNearest = i === 0;
                const cls = isNearest ? 'custom-marker nearest-marker' : 'custom-marker';
                const sz = isNearest ? [20, 20] : [14, 14];
                const anch = isNearest ? [10, 10] : [7, 7];
                const icon = L.divIcon({ className: cls, iconSize: sz, iconAnchor: anch });
                const marker = L.marker([s.lat, s.lng], { icon: icon }).addTo(map);

                const d = formatDist(s.distance);
                const mapsUrl = `https://maps.apple.com/?daddr=${s.lat},${s.lng}`;
                const katBadge = s.kategorie === 1
                    ? '<span style="background:#ffd700;color:#000;font-size:10px;padding:1px 6px;border-radius:6px;font-weight:700;margin-left:4px">KAT 1</span>'
                    : '';

                marker.bindPopup(`
                    <div class="popup-content">
                        <h3>${s.name}${katBadge}</h3>
                        <p>${s.address}, ${s.zip} ${s.city}</p>
                        <p>${d.value} ${d.unit} entfernt</p>
                        <a href="tel:${s.phone}">${s.phone}</a><br>
                        <a class="nav-link" href="${mapsUrl}" target="_blank">Route starten</a>
                    </div>
                `);
                markers.push({ marker, studio: s });
            });

            if (studios.length > 0) {
                const nearest = studios.slice(0, 5);
                const bounds = L.latLngBounds([[lat, lng], ...nearest.map(s => [s.lat, s.lng])]);
                map.fitBounds(bounds, { padding: [50, 50] });
            }

            renderList(studios);
            document.getElementById('loading').classList.add('hidden');
        }

        function renderList(list) {
            const container = document.getElementById('studioList');
            container.innerHTML = '';

            list.forEach((s, i) => {
                const d = formatDist(s.distance);
                const card = document.createElement('div');
                card.className = 'studio-card' + (i === 0 && list === studios ? ' nearest' : '');
                const katLabel = s.kategorie === 1 ? ' <span style="background:#ffd700;color:#000;font-size:9px;padding:1px 5px;border-radius:5px;font-weight:700">KAT 1</span>' : '';
                card.innerHTML = `
                    <div class="studio-distance">
                        <div class="dist-value">${d.value}</div>
                        <div class="dist-unit">${d.unit}</div>
                    </div>
                    <div class="studio-info">
                        <div class="name">${s.name.replace('Activ Fitness ', '')}${katLabel}</div>
                        <div class="address">${s.address}, ${s.zip} ${s.city}</div>
                    </div>
                    <div class="studio-nav">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                    </div>
                `;
                card.addEventListener('click', () => {
                    map.setView([s.lat, s.lng], 16, { animate: true });
                    const found = markers.find(m => m.studio === s);
                    if (found) found.marker.openPopup();
                    collapseSheet();
                });
                container.appendChild(card);
            });

            document.getElementById('studioCount').textContent = `${list.length} Studios`;
        }

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            if (!q) { renderList(studios); return; }
            const filtered = studios.filter(s =>
                s.name.toLowerCase().includes(q) ||
                s.city.toLowerCase().includes(q) ||
                s.address.toLowerCase().includes(q) ||
                s.zip.includes(q)
            );
            renderList(filtered);
        });

        // Bottom sheet
        function collapseSheet() { document.getElementById('bottomSheet').classList.add('collapsed'); sheetExpanded = false; }
        function expandSheet() { document.getElementById('bottomSheet').classList.remove('collapsed'); sheetExpanded = true; }

        document.getElementById('sheetHandle').addEventListener('click', () => { sheetExpanded ? collapseSheet() : expandSheet(); });
        document.getElementById('btn-list').addEventListener('click', () => { sheetExpanded ? collapseSheet() : expandSheet(); });
        document.getElementById('btn-locate').addEventListener('click', () => { if (userLat && userLng) map.setView([userLat, userLng], 14, { animate: true }); });

        // Touch swipe
        let touchStartY = 0;
        const sheet = document.getElementById('bottomSheet');
        sheet.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
        sheet.addEventListener('touchend', (e) => {
            const diff = touchStartY - e.changedTouches[0].clientY;
            if (diff > 50) expandSheet(); else if (diff < -50) collapseSheet();
        }, { passive: true });

        // Register service worker
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
    </script>
</body>
</html>
